<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Settings | TaskFlow</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            TaskFlow
        </div>

        <nav class="navigation">

            <a href="/dashboard" class="nav-link">
                <span>▣</span>
                Dashboard
            </a>

            <a href="/users-page" class="nav-link">
                <span>♙</span>
                Users
            </a>

            <a href="/todos-page" class="nav-link">
                <span>✓</span>
                TODOs
            </a>

            <a
                href="/settings-page"
                class="nav-link active"
            >
                <span>⚙</span>
                Settings
            </a>

            <a href="/help-page" class="nav-link">
                <span>?</span>
                Help
            </a>

            <a href="/logout" class="nav-link logout-link">
                <span>↪</span>
                Logout
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div class="page-title">

                <h1>Settings</h1>

                <p>
                    Manage your TaskFlow account.
                </p>

            </div>

        </header>


        <section class="dashboard-card">

            <div class="settings-item">

                <strong>
                    Account
                </strong>

                <p>
                    Manage your TaskFlow account information.
                </p>

            </div>


            <div class="settings-item">

                <strong>
                    Security
                </strong>

                <p>
                    Your password is securely hashed
                    before being stored.
                </p>

            </div>


            <div class="settings-item">

                <strong>
                    Login Session
                </strong>

                <p>
                    Your account is currently logged in.
                </p>

            </div>


            <a
                href="/logout"
                class="button-link"
            >
                Logout
            </a>

        </section>

    </main>

</div>

</body>

</html>
