<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TODOs | TaskFlow</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            TaskFlow
        </div>

        <nav class="navigation">

            <a href="/dashboard" class="nav-link">
                <span>▣</span>
                Dashboard
            </a>

            <a href="/users-page" class="nav-link">
                <span>♙</span>
                Users
            </a>

            <a
                href="/todos-page"
                class="nav-link active"
            >
                <span>✓</span>
                TODOs
            </a>

            <a href="/settings-page" class="nav-link">
                <span>⚙</span>
                Settings
            </a>

            <a href="/help-page" class="nav-link">
                <span>?</span>
                Help
            </a>

            <a href="/logout" class="nav-link logout-link">
                <span>↪</span>
                Logout
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div class="page-title">

                <h1>TODOs</h1>

                <p>
                    Create and manage your tasks.
                </p>

            </div>

        </header>


        <section class="dashboard-card">

            <h2>
                Add New TODO
            </h2>

            <form id="todo-form">

                <div class="todo-form">

                    <input
                        type="text"
                        id="todo-description"
                        placeholder="Enter a new task..."
                        required
                    >

                    <button
                        type="submit"
                        class="button-link form-button"
                    >
                        Add TODO
                    </button>

                </div>

            </form>

            <p id="todo-message"></p>

        </section>


        <section class="dashboard-card">

            <div class="section-header">

                <div>

                    <h2>
                        My TODO List
                    </h2>

                    <p>
                        Your current tasks.
                    </p>

                </div>

            </div>


            <div
                id="todo-container"
                class="todo-container"
            >
                Loading TODOs...
            </div>

        </section>

    </main>

</div>

<script src="/todos.js"></script>

</body>

</html>
