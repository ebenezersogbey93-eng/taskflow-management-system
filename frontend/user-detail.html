<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Details | TaskFlow</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">TaskFlow</div>
        <nav class="navigation">
            <a href="/dashboard" class="nav-link"><span>▣</span> Dashboard</a>
            <a href="/users-page" class="nav-link active"><span>♙</span> Users</a>
            <a href="/todos-page" class="nav-link"><span>✓</span> TODOs</a>
            <a href="/settings-page" class="nav-link"><span>⚙</span> Settings</a>
            <a href="/help-page" class="nav-link"><span>?</span> Help</a>
            <a href="/logout" class="nav-link logout-link"><span>↪</span> Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="page-title">
                <h1>User Details</h1>
                <p>Profile and assigned tasks.</p>
            </div>
            <div class="user-profile">
                <button type="button" class="header-icon-button notification-button" id="notification-toggle" aria-label="Notifications">🔔<span id="notification-count" class="notification-count">0</span></button>
                <div class="notification-menu" id="notification-menu" hidden></div>
                <button type="button" class="profile-trigger" id="profile-toggle"><span class="user-avatar" id="user-avatar">👤</span><span class="profile-copy"><strong id="profile-username">Ebenezer</strong><small>Administrator</small></span><span class="profile-chevron">⌄</span></button>
                <div class="profile-menu" id="profile-menu" hidden><a href="/users-page">Profile</a><a href="/settings-page">Settings</a><a href="/logout">Logout</a></div>
            </div>
        </header>

        <section class="dashboard-card" id="user-detail-card">
            <div class="empty-state">
                <h3>Loading user details...</h3>
            </div>
        </section>

        <footer class="site-footer">
            <strong>TaskFlow v1.0</strong>
            <span>Built with Node.js &bull; Express &bull; SQLite</span>
            <span>&copy; 2026</span>
        </footer>
    </main>
</div>

<script src="/api.js"></script>
<script src="/header.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const userId = params.get("id") || window.location.pathname.split("/").pop();

async function loadUserDetail() {
    const card = document.getElementById("user-detail-card");
    try {
        const user = await getData(`/api/users/${userId}`);
        const todos = await getData(`/api/todos`);
        const userTodos = todos.filter(todo => Number(todo.user_id) === Number(user.id));
        const completed = userTodos.filter(todo => Number(todo.completed) === 1).length;

        card.innerHTML = `
            <div class="section-header">
                <div>
                    <h2>${escapeHTML(user.username)}</h2>
                    <p>${escapeHTML(user.email)}</p>
                </div>
                <span class="status-badge ${completed === userTodos.length && userTodos.length ? "completed" : "pending"}">
                    ${userTodos.length ? `${completed}/${userTodos.length} completed` : "No tasks"}
                </span>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon users-icon">👤</div>
                    <div class="stat-info">
                        <span>User ID</span>
                        <h2>#${user.id}</h2>
                        <small>Profile</small>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon todos-icon">✓</div>
                    <div class="stat-info">
                        <span>Total Tasks</span>
                        <h2>${userTodos.length}</h2>
                        <small>Assigned</small>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon completed-icon">●</div>
                    <div class="stat-info">
                        <span>Completed</span>
                        <h2>${completed}</h2>
                        <small>Finished</small>
                    </div>
                </div>
            </div>
            <div>
                <h3>Assigned Tasks</h3>
                ${userTodos.length ? userTodos.map(todo => `
                    <div class="recent-todo">
                        <div>
                            <strong>${escapeHTML(todo.description)}</strong>
                            <small>${todo.completed ? "Completed" : "Pending"}</small>
                        </div>
                        <span class="status-badge ${todo.completed ? "completed" : "pending"}">${todo.completed ? "Completed" : "Pending"}</span>
                    </div>
                `).join("") : '<div class="empty-state"><p>No tasks assigned yet.</p></div>'}
            </div>
        `;
    } catch (error) {
        card.innerHTML = `<div class="empty-state"><h3>User not found</h3><p>${escapeHTML(error.message)}</p></div>`;
    }
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadUserDetail();
</script>
</body>
</html>
