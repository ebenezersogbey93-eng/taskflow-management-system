<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Users | TaskFlow</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            TaskFlow
        </div>

        <nav class="navigation">

            <a
                href="/dashboard"
                class="nav-link"
            >
                <span>▣</span>
                Dashboard
            </a>

            <a
                href="/users-page"
                class="nav-link active"
            >
                <span>♙</span>
                Users
            </a>

            <a
                href="/todos-page"
                class="nav-link"
            >
                <span>✓</span>
                TODOs
            </a>

            <a
                href="/settings-page"
                class="nav-link"
            >
                <span>⚙</span>
                Settings
            </a>

            <a
                href="/help-page"
                class="nav-link"
            >
                <span>?</span>
                Help
            </a>

            <a
                href="/logout"
                class="nav-link logout-link"
            >
                <span>↪</span>
                Logout
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div class="page-title">

                <h1>Users</h1>

                <p>
                    Manage users registered in TaskFlow.
                </p>

            </div>

        </header>


        <section class="dashboard-card">

            <h2>
                Add New User
            </h2>

            <form id="add-user-form">

                <div class="form-row">

                    <input
                        type="text"
                        id="new-username"
                        placeholder="Username"
                        required
                    >

                    <input
                        type="email"
                        id="new-email"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="new-password"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="submit"
                        class="button-link form-button"
                    >
                        Add User
                    </button>

                </div>

                <p id="user-message"></p>

            </form>

        </section>


        <section class="dashboard-card">

            <div class="section-header">

                <div>

                    <h2>
                        All Users
                    </h2>

                    <p>
                        Registered TaskFlow users.
                    </p>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Username</th>

                            <th>Email</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="users-table">

                        <tr>

                            <td colspan="5">
                                Loading users...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="/users.js"></script>

</body>

</html>
