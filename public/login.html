<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | TaskFlow</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="login-page">

    <main class="login-shell">
        <section class="login-intro">
            <div class="login-brand-mark"><i class="fa-solid fa-list-check" aria-hidden="true"></i></div>
            <p class="login-eyebrow">TASKFLOW MANAGEMENT</p>
            <h1>Everything your team needs to stay in motion.</h1>
            <p>Organize users, assign tasks, and keep your work visible from one focused workspace.</p>
            <div class="login-feature-list">
                <span><i class="fa-solid fa-chart-line" aria-hidden="true"></i> Clear progress at a glance</span>
                <span><i class="fa-solid fa-users" aria-hidden="true"></i> One workspace for every team</span>
            </div>
        </section>

        <section class="login-card">

            <div class="login-logo" id="login-logo"><i class="fa-solid fa-lock" aria-hidden="true"></i></div>

        <h2 id="auth-title">Welcome back</h2>

            <p class="login-subtitle" id="auth-subtitle">Sign in to continue to your dashboard.</p>

            <form id="login-form">

            <div class="form-group">

                <label for="username">
                    <i class="fa-solid fa-user" aria-hidden="true"></i> Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group register-only" hidden>
                <label for="email"><i class="fa-solid fa-envelope" aria-hidden="true"></i> Email</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>

            <div class="form-group">

                <label for="password">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i> Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
            >
                <span id="auth-submit-label">Login</span>
            </button>

            <p id="login-message"></p>

            </form>

            <button type="button" class="auth-switch" id="auth-switch">New to TaskFlow? Create an account</button>

            <small class="login-footer">Secure workspace access</small>
        </section>
    </main>

    <script src="/login.js"></script>

</body>

</html>
